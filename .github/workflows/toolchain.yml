# SPDX-License-Identifier: Apache-2.0
name: toolchain

# Builds the NeoSymbian build image (docker/toolchain) and publishes it to ghcr.io/neosymbian/toolchain:
#   push to main touching docker/toolchain -> :latest + :sha-<short>
#   workflow_dispatch                      -> the same, on demand
# build.sh, boot.sh and the kernel's tools pin the image by digest, so a new publish changes nothing until a pin moves.
on:
  push:
    branches: [main]
    paths: ['docker/toolchain/**', '.github/workflows/toolchain.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t neosymbian/toolchain:ci docker/toolchain
      - name: Smoke test
        run: |
          docker run --rm neosymbian/toolchain:ci sh -c '
            set -eu
            arm-none-eabi-gcc --version | head -1
            aarch64-linux-gnu-g++-14 --version | head -1
            rcomp 2>&1 | grep -q "Resource compiler"
            rofsbuild 2>&1 | grep -q "ROFSBUILD"
            readimage 2>&1 | grep -q "Readimage"
            uidcrc 0x10000079 0x100039ce 0x10005b8b /tmp/u && [ "$(wc -c < /tmp/u)" = 16 ]
            qemu-system-aarch64 --version | head -1
            qemu-system-arm -M help | grep -q "^syborg "
            python3 -c "import PIL"'
      - name: Publish
        run: |
          set -eu
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for t in latest "sha-${GITHUB_SHA::7}"; do
            docker tag neosymbian/toolchain:ci "ghcr.io/neosymbian/toolchain:$t"
            docker push "ghcr.io/neosymbian/toolchain:$t"
          done
          docker inspect --format '{{index .RepoDigests 0}}' ghcr.io/neosymbian/toolchain:latest | tee -a "$GITHUB_STEP_SUMMARY"
