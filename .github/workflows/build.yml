name: build

on:
  push:
    branches: [main]     # a PR branch builds once, as its pull_request
  pull_request:
  workflow_dispatch:

# a newer push to the same PR (or main) cancels the build still running for the older one
concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  minigui:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write     # the prebuilt base (below)
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the Symbian sources
        run: ./fetch.sh

      # on main, also the prebuilt base (base/): neoui's and e32-rs's CI pull it and build only their EXEs and the ROM
      - name: Build the ROM
        run: BASE_OUT=${{ github.event_name == 'push' && '1' || '' }} ./build.sh

      - name: Boot it on QEMU Syborg
        run: ./boot.sh

      - name: Check the boot
        run: |
          # the file server, the window server and the shell were started, and nothing faulted
          grep -q '\[proc\] create .*ESHELL' out/serial.log
          ! grep -q 'K::Fault\|Kern::Fault' out/serial.log
          # the screen is not blank: the framebuffer holds more than one colour (text on a plain background)
          python3 - <<'PY'
          d = open('out/fb.ppm', 'rb').read()
          pix = d[-768 * 640 * 3:]
          assert len(set(pix[i:i + 3] for i in range(0, len(pix), 3))) >= 2, "screen is blank"
          print("screen has content")
          PY

      # the 2010 user side without sources or ROM: EPL-1.0 Symbian binaries only (no Slint), its sources public
      - name: Publish the prebuilt base (ghcr.io/neosymbian/userside-base:<commit>)
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          t=ghcr.io/neosymbian/userside-base:${{ github.sha }}
          printf 'FROM busybox:1.36.1\nLABEL org.opencontainers.image.source=https://github.com/NeoSymbian/build\nCOPY . /base\n' |
            docker build -q -t "$t" -f - base
          docker push -q "$t"
          echo "prebuilt base: $t ($(du -sh base | cut -f1))" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: The AArch64 kernel for QEMU virt, with this user side
        run: KERNEL=src/oss.FCL.sf.os.kernelhwsrv ./neo kernel qemu

      # debug access (docs debug-access.md): fshell on the second serial port, driven from the host
      - name: fshell over the debug serial port (ls, hash, ps, exit status, YMODEM round trip)
        shell: bash
        run: |
          set -o pipefail
          . ./images.sh
          K=$PWD/src/oss.FCL.sf.os.kernelhwsrv
          docker run --rm --user "$(id -u):$(id -g)" -v "$K:/kernel" -w /kernel/baseport/arm64/tools \
            -e OUT=/kernel/out/ekern-qemu "$BUILD_IMAGE" python3 test-fshell-qemu.py 300 | tee out/fshell-qemu.log
          grep -q '^test-fshell-qemu: PASS$' out/fshell-qemu.log
          cp "$K/out/ekern-qemu/serial.log" out/fshell-qemu-serial.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boot
          path: |
            out/fb.png
            out/serial.log
            out/log/
            out/qemu-monitor.log
            out/fshell-qemu.log
            out/fshell-qemu-serial.log
